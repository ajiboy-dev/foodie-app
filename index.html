<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>FoodieHub</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="app-shell">
      <!-- HEADER -->
      <header class="header">
        <div class="header-top">
        <div>
          <p class="header-label">Deliver to</p>
          <p class="header-location">Lagos, NG 📍</p>
        </div>
        <button class="cart-btn" onclick="toggleCart()">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path
              d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
            />
          </svg>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
      <h1 class="header-title">What are you <br /><em>craving today?</em></h1>

      <!-- Search Bar -->
      <div class="search-wrap">
        <svg
          class="search-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          type="text"
          id="searchInput"
          placeholder="Search dishes, soups, grills..."
          oninput="renderMenu()"
        />
      </div>
    </header>

    <!-- CATEGORY PILLS -->
    <section class="categories">
      <div class="cat-scroll" id="catScroll">
        <button class="cat-pill active" onclick="setCategory('All', this)">
          All
        </button>
        <button class="cat-pill" onclick="setCategory('Rice', this)">
          🍚 Rice
        </button>
        <button class="cat-pill" onclick="setCategory('Soup', this)">
          🥘 Soup
        </button>
        <button class="cat-pill" onclick="setCategory('Grills', this)">
          🔥 Grills
        </button>
        <button class="cat-pill" onclick="setCategory('Snacks', this)">
          🍢 Snacks
        </button>
        <button class="cat-pill" onclick="setCategory('Drinks', this)">
          🥤 Drinks
        </button>
      </div>
    </section>

    <!-- FEATURED BANNER -->
    <section class="featured">
      <div class="featured-card">
        <div class="featured-text">
          <span class="featured-badge">Today's Special</span>
          <p class="featured-name">Smoky Party Jollof</p>
          <p class="featured-desc">With grilled chicken & coleslaw</p>
          <p class="featured-price">₦2,500</p>
        </div>
        <div class="featured-img">🍛</div>
      </div>
    </section>

    <!-- MENU SECTION TITLE -->
    <section class="menu-section">
      <div class="menu-header">
        <h2 class="menu-title">Our Menu</h2>
        <span class="menu-count" id="menuCount">0 items</span>
      </div>

      <!-- MENU GRID -->
      <div class="menu-grid" id="menuGrid"></div>
      <p class="empty-msg" id="emptyMsg" style="display: none">
        No dishes found. Try a different search!
      </p>
    </section>

    <!-- CART DRAWER -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
      <div class="cart-header">
        <h2 class="cart-title">Your Cart</h2>
        <button class="cart-close" onclick="toggleCart()">✕</button>
      </div>
      <div class="cart-items" id="cartItems">
        <p class="cart-empty">
          Your cart is empty.<br />Add something delicious!
        </p>
      </div>
      <div class="cart-footer" id="cartFooter" style="display: none">
        <div class="cart-total-row">
          <span>Subtotal</span>
          <span id="cartSubtotal">₦0</span>
        </div>
        <div class="cart-total-row">
          <span>Delivery</span>
          <span>₦500</span>
        </div>
        <div class="cart-total-row total">
          <span>Total</span>
          <span id="cartTotal">₦0</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">Place Order</button>
      </div>
    </div>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="nav-item active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-item">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <span>Search</span>
      </button>
      <button class="nav-item" onclick="toggleCart()">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path
            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
          />
        </svg>
        <span>Cart</span>
      </button>
      <button class="nav-item">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <span>Profile</span>
      </button>
    </nav>

    <script src="app.js"></script>
  </body>
</html>
